# Additive Blue composition. The domain row keeps TokenLedger's existing Web
# client and public services; the second row consumes only tokenLedgerV1.
- insert:
    - id: tokenledger-domain
      name: dsh-tokenledger
      config:
        database: !!js dshHomePath('tokenledger.sqlite')
        sweepIntervalMs: 60000
        sweepOnStart: true
        commandEnabled: false
    - id: tokenledger-blue
      name: '@dsh-blue/tokenledger'
